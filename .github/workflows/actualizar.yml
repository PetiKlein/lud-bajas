name: Actualizar planillas y bajas

on:
  schedule:
    # Horario en UTC (Uruguay = UTC-3): domingo 18:35 y lunes a jueves 20:35 en Montevideo,
    # para agarrar las planillas que la Liga carga tarde.
    - cron: '35 21 * * 0'
    - cron: '35 23 * * 1-4'
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/actualizar.yml']
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/detalle.mjs
        env:
          MAX_MIN: '120'
      - run: node scripts/analizar.mjs
      - name: Guardar datos
        if: always()
        run: |
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add planillas data
          git diff --cached --quiet || { git commit -m "Planillas y bajas actualizadas" && git push; }
