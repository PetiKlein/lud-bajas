name: Explorar escudos (temporal)
on:
  push:
    branches: [escudos]
    paths: ['tmp/escudos.sh']
permissions:
  contents: write
jobs:
  e:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: bash tmp/escudos.sh
      - run: |
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add -f tmp/ls && git commit -m "lud-stats" && git push
