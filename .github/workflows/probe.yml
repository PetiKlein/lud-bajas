name: Probar sanciones (temporal)
on:
  push:
    branches: [sanciones]
    paths: ['scripts/sanciones.mjs']
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: node scripts/sanciones.mjs
      - run: |
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add planillas/_sanciones && git commit -m "Sanciones" && git push
