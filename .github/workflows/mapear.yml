name: Mapear categorías (temporal)
on:
  push:
    branches: [mapear2]
    paths: ['tmp/mapear.mjs']
permissions:
  contents: write
jobs:
  m:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: node tmp/mapear.mjs
      - run: |
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add -f tmp/mapa2.json && git commit -m "mapa" && git push
