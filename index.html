<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LUD Bajas</title>
<meta name="description" content="Minutos, planteles y posibles bajas de Mayores A y Sub 20 A de la Liga Universitaria, sacados de las planillas oficiales.">
<meta name="theme-color" content="#173a5e">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Concepto: la planilla del árbitro. Franja azul tinta arriba con líneas de tiza; abajo, papel. */
:root{
  --pitch:#173a5e; --pitch-2:#1b4269; --pitch-ink:#0e2540; --chalk:#f5f7fa;
  --bg:#eef1f4; --surface:#ffffff; --surface-2:#e5eaf0; --line:#d2dae3;
  --fg:#142231; --muted:#5a6878;
  --accent:#1f5f9e; --accent-soft:#dde8f4;
  --sel:#142231; --sel-fg:#ffffff;
  --yellow:#f2c230; --red:#d0453a; --red-soft:#f7e0dd;
  --amber:#b7791f; --amber-soft:#f8ecd2;
  --play:#1d6b3c; --play-sub:#7fb894; --bar:#e2e9e0;
  --display:"Big Shoulders Display","Arial Narrow",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --pitch:#10263d; --pitch-2:#132c46; --pitch-ink:#0a1a2b; --chalk:#eef3f8;
  --bg:#0b1219; --surface:#121c27; --surface-2:#192634; --line:#243446;
  --fg:#e6edf4; --muted:#93a3b4;
  --accent:#7cb4ea; --accent-soft:#16263a;
  --sel:#e6edf4; --sel-fg:#0b1219;
  --red:#ec7a6c; --red-soft:#3a1b18; --amber:#e3b04b; --amber-soft:#33280f;
  --play:#5fcf8c; --play-sub:#2f7a4c; --bar:#1d3026;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --pitch:#10263d; --pitch-2:#132c46; --pitch-ink:#0a1a2b; --chalk:#eef3f8;
  --bg:#0b1219; --surface:#121c27; --surface-2:#192634; --line:#243446;
  --fg:#e6edf4; --muted:#93a3b4;
  --accent:#7cb4ea; --accent-soft:#16263a;
  --sel:#e6edf4; --sel-fg:#0b1219;
  --red:#ec7a6c; --red-soft:#3a1b18; --amber:#e3b04b; --amber-soft:#33280f;
  --play:#5fcf8c; --play-sub:#2f7a4c; --bar:#1d3026;
  color-scheme:dark}
*{box-sizing:border-box}
html{padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--pitch)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:var(--accent)}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}

/* ---------- cancha ---------- */
.pitch{position:relative;overflow:hidden;color:var(--chalk);background:repeating-linear-gradient(90deg,var(--pitch) 0 56px,var(--pitch-2) 56px 112px)}
.pitch::after{content:"";position:absolute;pointer-events:none;width:300px;height:300px;right:-110px;bottom:-170px;border:2px solid color-mix(in srgb,var(--chalk) 22%,transparent);border-radius:50%}
header.top{position:relative;z-index:1;padding-block:16px 12px}
header.top h1{font-family:var(--display);font-weight:900;font-size:2rem;line-height:.95;margin:0}
header.top p{margin:4px 0 0;font-size:.78rem;color:color-mix(in srgb,var(--chalk) 75%,transparent)}
header.top p a{color:var(--chalk)}
.picker{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding-bottom:14px}
.mine{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 14px 0 11px;border-radius:999px;font-family:var(--display);font-weight:800;font-size:1.05rem;text-decoration:none;color:var(--chalk);border:1.5px solid color-mix(in srgb,var(--chalk) 35%,transparent)}
.mine svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round}
.mine[aria-current="page"]{background:var(--yellow);border-color:var(--yellow);color:#2a2000}
.mine[aria-current="page"] svg,.mine.set svg{fill:currentColor}
.mine.set:not([aria-current]) svg{color:var(--yellow)}
.cats{display:flex;background:color-mix(in srgb,var(--pitch-ink) 70%,transparent);border-radius:999px;padding:3px}
.cats button{font-family:var(--display);font-weight:800;font-size:1.05rem;border:0;background:none;color:color-mix(in srgb,var(--chalk) 70%,transparent);padding:5px 13px 4px;border-radius:999px;cursor:pointer;white-space:nowrap}
.cats button[aria-pressed="true"]{background:var(--chalk);color:var(--pitch-ink)}
.divs{display:flex;gap:4px;flex-wrap:wrap}
.divs button{font-family:var(--display);font-weight:800;font-size:1.05rem;min-width:36px;height:36px;border-radius:10px;border:1.5px solid color-mix(in srgb,var(--chalk) 35%,transparent);background:none;color:var(--chalk);cursor:pointer}
.divs button[aria-pressed="true"]{background:var(--chalk);border-color:var(--chalk);color:var(--pitch-ink)}
.divs button:hover{border-color:var(--chalk)}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--pitch-ink)}
nav.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs a{font-family:var(--display);font-weight:800;font-size:1.12rem;text-decoration:none;color:color-mix(in srgb,var(--chalk) 60%,transparent);padding:10px 11px 8px;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs a[aria-current="page"]{color:var(--chalk);border-bottom-color:var(--chalk)}

/* ---------- contenido ---------- */
main{padding-block:18px 64px;display:flex;flex-direction:column;gap:18px}
h2{font-family:var(--display);font-weight:800;font-size:1.6rem;line-height:1;margin:0}
h3{font-family:var(--display);font-weight:800;font-size:1.25rem;line-height:1.05;margin:0}
.lede{color:var(--muted);font-size:.9rem;margin:0}
.muted{color:var(--muted)}
.small{font-size:.8rem}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.back{font-size:.85rem;text-decoration:none;display:inline-flex;gap:4px;align-items:center}
details.help{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;font-size:.88rem}
details.help summary{cursor:pointer;font-weight:600}
details.help ul{margin:8px 0 2px;padding-left:18px}
details.help li{margin-bottom:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:inherit;font-size:.8rem;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:5px 11px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--sel);color:var(--sel-fg);border-color:var(--sel)}
input.search{font:inherit;width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}

/* escudos */
.crest{width:28px;height:28px;flex:0 0 28px;border-radius:7px;background:var(--surface-2);display:inline-grid;place-items:center;overflow:hidden;font-family:var(--display);font-weight:800;font-size:.85rem;color:var(--muted)}
.crest img{width:100%;height:100%;object-fit:contain}
.crest.lg{width:52px;height:52px;flex-basis:52px;border-radius:12px;font-size:1.3rem}

/* bajas */
.fixture{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.fixture-h{display:flex;justify-content:space-between;gap:10px;padding:10px 14px;background:var(--surface-2);font-size:.78rem;color:var(--muted)}
.fixture-h b{color:var(--fg)}
.side{padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.side + .side{border-top:1px solid var(--line)}
.side-h{display:flex;align-items:center;gap:9px}
.side-h a{font-family:var(--display);font-weight:800;font-size:1.2rem;color:var(--fg);text-decoration:none}
.side-h small{margin-left:auto;font-size:.75rem;color:var(--muted);text-align:right}
.alert{display:grid;grid-template-columns:auto 1fr;gap:2px 9px;align-items:start;font-size:.88rem}
.alert .lvl{grid-row:span 2;font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:2px 7px;border-radius:6px;margin-top:2px}
.lvl.alta{background:var(--red-soft);color:var(--red)}
.lvl.media{background:var(--amber-soft);color:var(--amber)}
.lvl.baja{background:var(--surface-2);color:var(--muted)}
.alert a{font-weight:700;color:var(--fg);text-decoration:none}
.alert a:hover{text-decoration:underline}
.alert span{color:var(--muted)}
.ok{font-size:.85rem;color:var(--muted)}
.fixture-h .share{flex:0 0 auto;text-decoration:none}
.share{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:.78rem;font-weight:700;color:var(--accent);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 11px;cursor:pointer;white-space:nowrap}
.share svg{width:15px;height:15px}
.share:hover{border-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--sel);color:var(--sel-fg);padding:10px 16px;border-radius:12px;font-size:.88rem;font-weight:600;z-index:20;box-shadow:0 6px 20px rgba(0,0,0,.25)}
/* rankings */
.rk{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.rk .card{padding:0;overflow:hidden}
.rk h3{padding:12px 14px 4px}
.rk .sub{padding:0 14px 8px;font-size:.78rem;color:var(--muted)}
.rk ol{list-style:none;margin:0;padding:0}
.rk li{display:grid;grid-template-columns:22px 28px minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 14px;border-top:1px solid var(--line);font-size:.88rem}
.rk li .p{font-family:var(--display);font-weight:800;color:var(--muted);text-align:right}
.rk li a{color:var(--fg);text-decoration:none;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk li .eq{display:block;font-size:.74rem;color:var(--muted);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk li .v{font-family:var(--display);font-weight:800;font-size:1.15rem;font-variant-numeric:tabular-nums;text-align:right}
.rk li .v small{font-family:var(--body);font-weight:500;font-size:.72rem;color:var(--muted);margin-left:3px}
.rk .crest{width:24px;height:24px;flex-basis:24px;border-radius:6px}
/* cruces y sanciones */
.xrow{display:grid;grid-template-columns:minmax(0,1fr);gap:4px;padding:10px 14px;border-top:1px solid var(--line);font-size:.86rem}
.xrow:first-of-type{border-top:0}
.xrow > a{font-weight:700;color:var(--fg);text-decoration:none}
.xrow .aqui{color:var(--muted);font-size:.8rem}
.xrow .otra{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}
.xrow .otra a{font-weight:600}
.xrow .otra span{color:var(--muted);font-size:.8rem}
.tag.blue{background:var(--accent-soft);color:var(--accent)}
.tag.amber{background:var(--amber-soft);color:var(--amber)}
.sx{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;padding:10px 14px;border-top:1px solid var(--line);font-size:.86rem;align-items:start}
.sx:first-of-type{border-top:0}
.sx .crest{grid-row:span 2;margin-top:2px}
.sx a.n{font-weight:700;color:var(--fg);text-decoration:none}
.sx .t{color:var(--muted)}
details.more summary{cursor:pointer;font-weight:600;padding:10px 14px;font-size:.9rem}
/* previas */
.forma{display:inline-flex;gap:3px}
.forma b{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;font-size:.7rem;font-weight:800;color:#fff}
.forma .G{background:#2f8f55}.forma .E{background:#8a96a3}.forma .P{background:#c9493d}
.pv-card{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);color:inherit;text-decoration:none}
.pv-card:first-of-type{border-top:0}
.pv-card .t{display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;font-weight:700;min-width:0;overflow-wrap:anywhere}
.pv-card .mid{text-align:center;font-size:.78rem;color:var(--muted);line-height:1.3}
.pv-card .mid b{display:block;font-family:var(--display);font-weight:800;font-size:1.15rem;color:var(--fg)}
.two{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:640px){.two{grid-template-columns:1fr 1fr}}
.xi .pl{display:grid;grid-template-columns:26px minmax(0,1fr) 44px;gap:2px 8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:.86rem}
.xi .pl:last-child{border-bottom:0}
.xi .pl .n{font-size:.75rem;color:var(--muted);text-align:right}
.xi .pl a{color:var(--fg);text-decoration:none;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xi .pl .pc{text-align:right;font-variant-numeric:tabular-nums;font-size:.78rem;color:var(--muted)}
.xi .pl .bar{grid-column:2/4;height:5px}
.xi .sep{font-size:.7rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;padding:10px 0 2px}
.tramos{display:grid;grid-template-columns:52px 1fr 1fr;gap:4px 8px;align-items:center;font-size:.76rem;font-variant-numeric:tabular-nums}
.tramos .h{color:var(--muted);font-weight:700;text-transform:uppercase;font-size:.66rem;letter-spacing:.03em}
.tramos .r{color:var(--muted);white-space:nowrap}
.tramos .bf,.tramos .bc{height:14px;border-radius:4px;display:flex;align-items:center;padding:0 5px;font-weight:700;font-size:.7rem;color:#fff;min-width:0}
.tramos .bf{background:#2f8f55}.tramos .bc{background:#c9493d}
.tramos .z{color:var(--muted);font-weight:500}
.dato{font-size:.85rem;margin:8px 0 0}
.h2h{display:grid;grid-template-columns:auto minmax(0,1fr) auto minmax(0,1fr);gap:6px 8px;align-items:center;padding:8px 14px;border-top:1px solid var(--line);font-size:.84rem;color:inherit;text-decoration:none}
.h2h:first-of-type{border-top:0}
.h2h .dv{font-size:.72rem;color:var(--muted);white-space:nowrap}
.h2h .r{text-align:right}
.h2h .sc{font-family:var(--display);font-weight:800;font-size:1.05rem;background:var(--surface-2);border-radius:6px;padding:1px 7px;white-space:nowrap}
/* mi equipo */
.club-h{display:flex;align-items:center;gap:12px}
.club-pick{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);color:inherit;text-decoration:none;cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;font:inherit;text-align:left}
.club-pick:first-child{border-top:0}
.club-pick span.n{font-weight:700}
.club-pick small{color:var(--muted);font-size:.76rem;text-align:right}
.team-card .fixture-h a{color:inherit}
.nx{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:12px 14px;font-size:.9rem}
.nx b{font-family:var(--display);font-weight:800;font-size:1.15rem}


/* tablas */
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:.88rem}
th,td{padding:9px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;cursor:pointer;user-select:none}
th:first-child,td:first-child{text-align:left;padding-left:12px}
tr:last-child td{border-bottom:0}
td.name{white-space:normal;min-width:118px}
td.name a{color:var(--fg);text-decoration:none;font-weight:600}
td .num{color:var(--muted);font-size:.75rem;margin-right:4px}
th[aria-sort]{color:var(--fg)}
.last5{display:inline-flex;gap:2px;vertical-align:middle}
.last5 i{display:block;width:9px;height:18px;border-radius:3px;background:var(--bar);position:relative;overflow:hidden}
.last5 i b{position:absolute;inset:auto 0 0;background:var(--play)}
.last5 i.sub b{background:var(--play-sub)}
.last5 i.none{background:none;border:1.5px dashed var(--line)}
.last5 i.rc::after{content:"";position:absolute;top:1px;right:1px;width:5px;height:6px;background:var(--red);border-radius:1px}

/* barras de minutos */
.bar{position:relative;height:10px;border-radius:5px;background:var(--bar);overflow:hidden}
.bar span{position:absolute;top:0;bottom:0;background:var(--play)}
.bar span.sub{background:var(--play-sub)}
.bar i{position:absolute;top:-1px;width:4px;height:12px;margin-left:-2px;background:var(--yellow);border-radius:2px}
.bar.lg{height:14px;border-radius:7px}

/* jugador */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.tile b{display:block;font-family:var(--display);font-weight:900;font-size:1.8rem;line-height:1;font-variant-numeric:tabular-nums}
.tile small{font-size:.74rem;color:var(--muted)}
.log{display:flex;flex-direction:column}
.log > a, .log > div{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}
.log > :last-child{border-bottom:0}
.log .f{font-family:var(--display);font-weight:800;font-size:1.05rem;width:34px;color:var(--muted)}
.log .r{font-weight:600}
.log .d{grid-column:2/4;font-size:.8rem;color:var(--muted)}
.log .bar{grid-column:2/4}
.log .min{font-family:var(--display);font-weight:800;font-size:1.25rem;font-variant-numeric:tabular-nums}
.log .nope .r{color:var(--muted);font-weight:500}
.tag{display:inline-block;font-size:.68rem;font-weight:700;padding:1px 6px;border-radius:5px;background:var(--surface-2);color:var(--muted);margin-left:4px;vertical-align:1px}
.tag.red{background:var(--red-soft);color:var(--red)}
.tag.gol{background:var(--accent-soft);color:var(--accent)}

/* partidos */
.match{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}
.match:last-child{border-bottom:0}
.match .t{display:flex;align-items:center;gap:7px;font-weight:600;min-width:0}
.match .t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.match .t.v{justify-content:flex-end;text-align:right}
.score{font-family:var(--display);font-weight:900;font-size:1.35rem;background:var(--pitch);color:#fff;border-radius:7px;padding:3px 9px 1px;font-variant-numeric:tabular-nums;white-space:nowrap}
.match .warn{grid-column:1/4;font-size:.72rem;color:var(--amber)}
.bigscore{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center;text-align:center}
.bigscore a{min-width:0;overflow-wrap:anywhere;color:var(--fg);text-decoration:none;font-family:var(--display);font-weight:800;font-size:1.25rem;line-height:1.05;display:flex;flex-direction:column;align-items:center;gap:6px}
.bigscore .score{font-size:2.4rem;padding:6px 14px 3px;border-radius:10px}
.timeline{display:flex;flex-direction:column;gap:2px}
.ev{display:grid;grid-template-columns:1fr 44px 1fr;align-items:center;gap:6px;font-size:.84rem;padding:5px 0}
.ev .m{text-align:center;font-family:var(--display);font-weight:800;font-size:1.05rem;color:var(--muted)}
.ev .l{text-align:right}
.ev a{text-decoration:none}
.ev .in{color:var(--accent);font-weight:600}
.ev .out{color:var(--muted)}
.lineups{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:640px){.lineups{grid-template-columns:1fr 1fr}}
.lineup .pl{display:grid;grid-template-columns:24px 1fr 34px;gap:2px 8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:.86rem}
.lineup .pl:last-child{border-bottom:0}
.lineup .pl .n{font-size:.75rem;color:var(--muted);text-align:right}
.lineup .pl a{color:var(--fg);text-decoration:none;font-weight:600}
.lineup .pl .mm{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.lineup .pl .bar{grid-column:2/4;height:6px}
.lineup .sep{font-size:.7rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;padding:10px 0 2px}
.issues{margin:0;padding-left:18px;font-size:.86rem}
.issues li{margin-bottom:4px}
footer{font-size:.78rem;color:var(--muted);padding-bottom:24px}
@media (max-width:420px){header.top h1{font-size:1.75rem} nav.tabs .wrap{gap:0;padding-left:8px;padding-right:8px} nav.tabs a{font-size:.98rem;padding:10px 7px 8px}}
</style>
</head>
<body>
<div class="pitch">
  <header class="top wrap">
    <div>
      <h1>LUD Bajas</h1>
      <p>Minutos y posibles bajas, sacados de las planillas oficiales de la Liga Universitaria</p>
    </div>
  </header>
  <div class="picker wrap">
    <a class="mine" id="mine" href="#/mi-equipo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4L2.8 9.5l6.4-.8z"/></svg><span>Mi equipo</span></a>
    <div class="cats" id="cats" role="group" aria-label="Categoría"></div>
    <div class="divs" id="divs" role="group" aria-label="Divisional"></div>
  </div>
</div>
<nav class="tabs" aria-label="Secciones"><div class="wrap" id="tabs"></div></nav>
<main class="wrap" id="main"><div class="empty">Cargando…</div></main>
<footer class="wrap" id="foot"></footer>

<script>
// Categorías y divisionales disponibles: salen de data/indice.json (lo escribe el robot).
let INDICE = null;
const DIVS = {}; // id de divisional -> { id, letra, nombre, categoria }
const ALIAS = { mayores: 'mayores-a', sub20: 'sub20-a' }; // links viejos
const guardar = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
const leer = k => { try { return localStorage.getItem(k); } catch { return null; } };
async function indice() {
  if (!INDICE) {
    const r = await fetch(`data/indice.json?v=${Math.floor(Date.now() / 6e5)}`);
    INDICE = await r.json();
    for (const c of INDICE.categorias) for (const d of c.divisionales) DIVS[d.id] = { ...d, categoria: c.id };
  }
  return INDICE;
}
const TABS = [['bajas', 'Bajas'], ['previas', 'Previas'], ['equipos', 'Equipos'], ['jugadores', 'Jugadores'], ['partidos', 'Partidos'], ['rankings', 'Rankings'], ['cruces', 'Entre categorías'], ['sanciones', 'Sanciones'], ['planillas', 'Planillas']];
const cache = {};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const slug = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const DIAS = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
const fDia = d => { const x = new Date(d + 'T12:00:00-03:00'); return `${DIAS[x.getUTCDay()]} ${d.slice(8, 10)}/${d.slice(5, 7)}`; };
const iniciales = n => n.split(/\s+/).filter(w => /^[A-ZÁÉÍÓÚÑ]/i.test(w)).slice(0, 2).map(w => w[0]).join('').toUpperCase();
const crest = (eq, lg) => `<span class="crest${lg ? ' lg' : ''}"><img src="escudos/${slug(eq)}.png" alt="" loading="lazy" onerror="this.replaceWith(document.createTextNode('${esc(iniciales(eq))}'))"></span>`;
const link = (cat, ...p) => '#/' + [cat, ...p.map(encodeURIComponent)].join('/');

// Tramos en cancha de un jugador en un partido: titular desde 0, salidas y reingresos.
function tramos(j, fin) {
  const ev = [...j.e.map(m => [m, 'e']), ...j.s.map(m => [m, 's'])].sort((a, b) => a[0] - b[0] || (a[1] === 's' ? -1 : 1));
  const out = []; let desde = j.t ? 0 : null;
  for (const [m, t] of ev) { if (t === 's' && desde != null) { out.push([desde, m]); desde = null; } else if (t === 'e' && desde == null) desde = m; }
  if (desde != null) out.push([desde, fin]);
  return out;
}
function barra(j, fin, lg) {
  const seg = tramos(j, fin).map(([a, b], i) => `<span class="${j.t && i === 0 ? '' : 'sub'}" style="left:${a / fin * 100}%;width:${(b - a) / fin * 100}%"></span>`).join('');
  const goles = (j.g || []).filter(m => m != null).map(m => `<i style="left:${Math.min(m, fin) / fin * 100}%" title="Gol ${m}'"></i>`).join('');
  return `<div class="bar${lg ? ' lg' : ''}" role="img" aria-label="${j.min} minutos">${seg}${goles}</div>`;
}
function rol(j) {
  const t = [];
  if (j.t) t.push(j.s.length && !j.e.some(e => e >= j.s[0]) ? `Titular, salió ${j.s.at(-1)}'` : 'Titular');
  else t.push(`Entró ${j.e[0]}'` + (j.s.length && j.s.at(-1) >= j.e.at(-1) ? `, salió ${j.s.at(-1)}'` : ''));
  if (j.t && j.s.length && j.e.some(e => e >= j.s[0])) t.push(`salió ${j.s[0]}' y volvió ${j.e.find(e => e >= j.s[0])}'`);
  return t.join(' · ');
}

async function datos(cat) {
  if (!cache[cat]) {
    const r = await fetch(`data/${cat}.json?v=${Math.floor(Date.now() / 6e5)}`);
    if (!r.ok) throw new Error('Todavía no hay datos de esta divisional.');
    const d = await r.json();
    // Índices útiles.
    d.porId = Object.fromEntries(d.partidos.map(p => [p.id, p]));
    d.porEquipo = {};
    for (const p of d.partidos) for (const [lado, yo, rival] of [['L', p.local, p.visitante], ['V', p.visitante, p.local]])
      (d.porEquipo[yo] ??= []).push({ p, lado, rival, gf: lado === 'L' ? p.gl : p.gv, gc: lado === 'L' ? p.gv : p.gl });
    d.stats = {};
    for (const p of d.partidos) if (p.planilla) for (const lado of ['L', 'V']) for (const j of p[lado]) {
      const s = (d.stats[j.c] ??= { pj: 0, tit: 0, min: 0, gol: 0, rojas: 0 });
      s.pj++; s.tit += j.t; s.min += j.min; s.gol += j.g.length; s.rojas += j.x;
    }
    cache[cat] = d;
  }
  return cache[cat];
}

function chrome(cat, tab) {
  // Al cambiar de divisional se queda en la misma sección (la lista, no la ficha).
  const seccion = { jugador: 'jugadores', partido: 'partidos', equipo: 'equipos', previa: 'previas' }[tab] || tab;
  const mine = $('#mine'); mine.removeAttribute('aria-current'); mine.classList.toggle('set', !!leer('club'));
  if (cat === 'mi-equipo') {
    mine.setAttribute('aria-current', 'page');
    const ultimaDe = c => { const u = leer('div-' + c.id); return c.divisionales.some(d => d.id === u) ? u : c.divisionales[0].id; };
    $('#cats').innerHTML = INDICE.categorias.map(c => `<button aria-pressed="false" onclick="location.hash='${link(ultimaDe(c), 'bajas')}'">${esc(c.nombre)}</button>`).join('');
    $('#divs').innerHTML = ''; $('#tabs').innerHTML = '';
    document.title = 'Mi equipo · LUD Bajas';
    return;
  }
  const actual = DIVS[cat];
  const ultimaDe = c => { const u = leer('div-' + c.id); return c.divisionales.some(d => d.id === u) ? u : c.divisionales[0].id; };
  $('#cats').innerHTML = INDICE.categorias.map(c => `<button aria-pressed="${c.id === actual.categoria}" onclick="location.hash='${link(c.id === actual.categoria ? cat : ultimaDe(c), seccion)}'">${esc(c.nombre)}</button>`).join('');
  const cActual = INDICE.categorias.find(c => c.id === actual.categoria);
  $('#divs').innerHTML = cActual.divisionales.length > 1 ? cActual.divisionales.map(d => `<button aria-pressed="${d.id === cat}" aria-label="${esc(d.nombre)}" onclick="location.hash='${link(d.id, seccion)}'">${esc(d.letra)}</button>`).join('') : '';
  document.title = `${actual.nombre} · LUD Bajas`;
  const activa = { jugador: 'jugadores', partido: 'partidos', equipo: 'equipos', previa: 'previas' }[tab] || tab;
  $('#tabs').innerHTML = TABS.map(([id, n]) => `<a href="${link(cat, id)}"${id === activa ? ' aria-current="page"' : ''}>${n}</a>`).join('');
  $('#tabs [aria-current]')?.scrollIntoView({ block: 'nearest', inline: 'center' });
}

// ---------- vistas ----------
const pend = b => b?.pendientes?.length ? `<div class="ok" style="color:var(--amber)">Ojo: la Liga todavía no cargó la planilla del partido contra ${b.pendientes.map(x => esc(x.rival)).join(' y ')} (${fDia(b.pendientes.at(-1).dia)}). Estas alertas miran el partido anterior.</div>` : '';
function vBajas(d, cat, filtro) {
  const nivel = filtro || 'todas';
  const pares = new Map(), sueltos = [];
  for (const eq of d.equipos) {
    const b = d.bajas[eq];
    if (!b?.proximo) { sueltos.push(eq); continue; }
    const [l, v] = b.proximo.local ? [eq, b.proximo.rival] : [b.proximo.rival, eq];
    const k = `${b.proximo.dia}|${l}|${v}`;
    if (!pares.has(k)) pares.set(k, { ...b.proximo, l, v });
  }
  const lado = eq => {
    const b = d.bajas[eq];
    if (!b) return `<div class="side"><div class="side-h">${crest(eq)}<a href="${link(cat, 'equipo', eq)}">${esc(eq)}</a></div><div class="ok">Sin datos de partidos.</div></div>`;
    const al = b.alertas.filter(a => nivel === 'todas' || a.nivel === 'alta');
    const u = b.ultimo;
    return `<div class="side"><div class="side-h">${crest(eq)}<a href="${link(cat, 'equipo', eq)}">${esc(eq)}</a>
      <small>Último: <a href="${link(cat, 'partido', u.id)}" style="font:inherit;color:inherit">${u.gf}-${u.gc} vs ${esc(u.rival)}</a></small></div>
      ${pend(b)}
      ${al.length ? al.map(a => `<div class="alert"><b class="lvl ${a.nivel}">${a.nivel}</b>${a.carne ? `<a href="${link(cat, 'jugador', a.carne)}">${esc(a.nombre)}</a>` : `<b>${esc(a.nombre)}</b>`}<span>${esc(a.texto)}</span></div>`).join('')
        : `<div class="ok">${b.alertas.length ? 'Solo alertas de nivel medio o bajo.' : 'Sin bajas detectadas.'}</div>`}</div>`;
  };
  const lista = [...pares.values()].sort((a, b) => (a.dia + a.hora).localeCompare(b.dia + b.hora));
  COMPARTIR = { cat, nivel, lista };
  return `
  <div class="stack"><h2>Posibles bajas</h2>
  <p class="lede">Lo que se puede deducir de las planillas: expulsados, titulares habituales que no jugaron y los que salieron temprano. Son pistas, no partes médicos.</p></div>
  <details class="help"><summary>¿Cómo se calcula?</summary><ul>
    <li><b>Suspendido:</b> sale de Fallos y Penas de la Liga (se actualiza los jueves). Dice cuántas fechas le quedarían, contando los partidos que jugó su equipo desde la expulsión. Si es de otra categoría también cuenta: la mayoría se cumplen en todas.</li>
    <li><b>Expulsado:</b> lo echaron en el último partido y la Liga todavía no publicó la sanción.</li>
    <li><b>Lesión probable:</b> titular habitual que salió antes del entretiempo y no jugó el partido siguiente.</li>
    <li><b>No jugó:</b> titular en al menos 6 de cada 10 partidos que no apareció en el último. En la LUD también puede ser un examen, un viaje o trabajo.</li>
    <li><b>Salió temprano:</b> titular que salió antes del entretiempo y no volvió (en la Liga hay reingreso, así que si volvió no cuenta).</li>
    <li><b>Entró y salió:</b> suplente que duró 20 minutos o menos. Nivel bajo: muchas veces es táctico.</li>
    <li><b>Jugó en otra categoría</b> o <b>puede volver</b> (ya cumplió la suspensión): nivel bajo, es para que sepas por qué no estuvo.</li>
  </ul></details>
  <div class="chips" role="group" aria-label="Filtro">
    <button class="chip" aria-pressed="${nivel === 'todas'}" onclick="location.hash='${link(cat, 'bajas')}'">Todas</button>
    <button class="chip" aria-pressed="${nivel === 'alta'}" onclick="location.hash='${link(cat, 'bajas', 'alta')}'">Solo nivel alto</button>
  </div>
  ${lista.length ? `<div class="row between"><h3>Próximos partidos</h3><button class="share" onclick="compartir()">${ICONO_COMPARTIR}<span>Toda la fecha</span></button></div>` + lista.map((f, i) => `<section class="fixture">
      <div class="fixture-h"><span><b>${esc(f.l)} vs ${esc(f.v)}</b><br>${fDia(f.dia)}${f.hora !== '00:00' ? ' · ' + f.hora : ''}${f.etapa ? ' · ' + esc(f.etapa) : ''}</span><span class="row" style="gap:6px;margin-left:auto"><a class="share" href="${link(cat, 'previa', f.l + '~' + f.v)}">Previa</a><button class="share" onclick="compartir(${i})" aria-label="Compartir las bajas de ${esc(f.l)} vs ${esc(f.v)}">${ICONO_COMPARTIR}<span>Compartir</span></button></span></div>
      ${lado(f.l)}${lado(f.v)}</section>`).join('') : ''}
  ${sueltos.length ? `<h3>${lista.length ? 'Sin partido programado' : 'Equipos'}</h3><section class="fixture">${sueltos.map(lado).join('')}</section>` : ''}`;
}

function vEquipos(d, cat) {
  return `<h2>Equipos</h2><div class="card" style="padding:0">` + d.equipos.map(eq => {
    const ps = (d.porEquipo[eq] || []);
    const g = ps.filter(x => x.gf > x.gc).length, e = ps.filter(x => x.gf === x.gc).length, pe = ps.length - g - e;
    const nAl = d.bajas[eq]?.alertas.filter(a => a.nivel === 'alta').length || 0;
    return `<a class="match" style="grid-template-columns:1fr auto" href="${link(cat, 'equipo', eq)}"><span class="t">${crest(eq)}<span>${esc(eq)}</span></span>
      <span class="small muted">${ps.length} PJ · ${g}G ${e}E ${pe}P${nAl ? ` · <b style="color:var(--red)">${nAl} baja${nAl > 1 ? 's' : ''}</b>` : ''}</span></a>`;
  }).join('') + `</div>`;
}

let orden = { k: 'min', dir: -1 };
function vEquipo(d, cat, eq) {
  const ps = (d.porEquipo[eq] || []).filter(x => x.p.planilla);
  if (!d.porEquipo[eq]) return `<div class="empty">No encontré ese equipo.</div>`;
  const ult5 = ps.slice(-5);
  const filas = {};
  for (const x of ps) for (const j of x.p[x.lado]) {
    const f = (filas[j.c] ??= { c: j.c, pj: 0, tit: 0, min: 0, gol: 0, rojas: 0, cam: j.cam });
    f.pj++; f.tit += j.t; f.min += j.min; f.gol += j.g.length; f.rojas += j.x; if (j.cam) f.cam = j.cam;
  }
  // Solo los que siguen en este equipo (si cambió de club, figura en el nuevo).
  let lista = Object.values(filas);
  lista.forEach(f => f.nombre = d.jugadores[f.c]?.nombre || f.c);
  const k = orden.k;
  lista.sort((a, b) => (k === 'nombre' ? a.nombre.localeCompare(b.nombre) : (a[k] - b[k])) * (k === 'nombre' ? 1 : orden.dir) || b.min - a.min);
  const fin = x => x.p.fin || 90;
  const cel = (f) => ult5.map(x => {
    const j = x.p[x.lado].find(j => j.c === f.c);
    if (!j) return `<i class="none" title="No jugó vs ${esc(x.rival)}"></i>`;
    return `<i class="${j.t ? '' : 'sub'}${j.x ? ' rc' : ''}" title="${j.min}' vs ${esc(x.rival)}"><b style="height:${Math.round(j.min / fin(x) * 100)}%"></b></i>`;
  }).join('');
  const th = (key, txt) => `<th data-k="${key}"${orden.k === key ? ' aria-sort="' + (orden.dir < 0 ? 'descending' : 'ascending') + '"' : ''}>${txt}</th>`;
  const todos = d.porEquipo[eq];
  const g = todos.filter(x => x.gf > x.gc).length, e = todos.filter(x => x.gf === x.gc).length;
  const b = d.bajas[eq];
  return `<a class="back" href="${link(cat, 'equipos')}">← Equipos</a>
  <div class="row">${crest(eq, true)}<div style="flex:1;min-width:0"><h2>${esc(eq)}</h2><div class="small muted">${todos.length} PJ · ${g}G ${e}E ${todos.length - g - e}P · GF ${todos.reduce((s, x) => s + x.gf, 0)} · GC ${todos.reduce((s, x) => s + x.gc, 0)}</div></div></div>
  <div class="row" style="flex-wrap:wrap;gap:8px">${b?.proximo ? `<a class="share" href="${link(cat, 'previa', (b.proximo.local ? eq + '~' + b.proximo.rival : b.proximo.rival + '~' + eq))}">Previa vs ${esc(b.proximo.rival)} · ${fDia(b.proximo.dia)}</a>` : ''}<button class="share" id="seguir" onclick="seguir('${cat}', ${esc(JSON.stringify(eq))})">☆ Hacer mi equipo</button></div>
  ${b?.alertas.length || b?.pendientes?.length ? `<section class="fixture"><div class="fixture-h"><b>Posibles bajas</b><span>${b.proximo ? 'Próximo: vs ' + esc(b.proximo.rival) + ' · ' + fDia(b.proximo.dia) : ''}</span></div><div class="side">${pend(b)}${b.alertas.map(a => `<div class="alert"><b class="lvl ${a.nivel}">${a.nivel}</b>${a.carne ? `<a href="${link(cat, 'jugador', a.carne)}">${esc(a.nombre)}</a>` : `<b>${esc(a.nombre)}</b>`}<span>${esc(a.texto)}</span></div>`).join('')}</div></section>` : ''}
  <div class="stack"><h3>Plantel</h3><p class="lede small">Tocá un encabezado para ordenar. En los últimos 5, la barra es el tiempo jugado: verde oscuro si fue titular, claro si entró desde el banco, punteado si no jugó y la esquina roja es una expulsión.</p></div>
  <div class="tablewrap"><table id="plantel"><thead><tr>${th('nombre', 'Jugador')}${th('pj', 'PJ')}${th('tit', 'Tit')}${th('min', 'Min')}${th('gol', 'Gol')}<th>Últimos 5</th></tr></thead><tbody>
  ${lista.map(f => `<tr><td class="name"><a href="${link(cat, 'jugador', f.c)}">${f.cam ? `<span class="num">${esc(f.cam)}</span>` : ''}${esc(f.nombre)}</a>${f.rojas ? ' <span class="tag red">' + f.rojas + ' roja' + (f.rojas > 1 ? 's' : '') + '</span>' : ''}</td><td>${f.pj}</td><td>${f.tit}</td><td><b>${f.min}</b></td><td>${f.gol || ''}</td><td><span class="last5">${cel(f)}</span></td></tr>`).join('')}
  </tbody></table></div>
  <div class="stack"><h3>Partidos</h3><div class="card" style="padding:0">${filaPartidos(cat, todos.map(x => x.p).slice().reverse())}</div></div>`;
}

function vJugadores(d, cat, q) {
  q = (q || '').trim();
  const nq = slug(q);
  let lista = Object.entries(d.jugadores).map(([c, j]) => ({ c, ...j, ...(d.stats[c] || {}) }));
  if (nq) lista = lista.filter(j => slug(j.nombre).includes(nq) || slug(j.equipo).includes(nq));
  lista.sort((a, b) => (b.min || 0) - (a.min || 0));
  const total = lista.length; lista = lista.slice(0, 80);
  return `<h2>Jugadores</h2>
  <input class="search" id="q" type="search" placeholder="Buscar por nombre o equipo" value="${esc(q)}" autocomplete="off">
  <p class="lede small">${nq ? `${total} resultado${total === 1 ? '' : 's'}` : `Los ${lista.length} con más minutos de ${total} jugadores`}.</p>
  <div class="tablewrap"><table><thead><tr><th>Jugador</th><th>PJ</th><th>Tit</th><th>Min</th><th>Gol</th></tr></thead><tbody>
  ${lista.map(j => `<tr><td class="name"><a href="${link(cat, 'jugador', j.c)}">${esc(j.nombre)}</a><div class="small muted">${esc(j.equipo)}</div></td><td>${j.pj || 0}</td><td>${j.tit || 0}</td><td><b>${j.min || 0}</b></td><td>${j.gol || ''}</td></tr>`).join('')}
  </tbody></table></div>`;
}

function vJugador(d, cat, c) {
  const info = d.jugadores[c];
  if (!info) return `<div class="empty">No encontré a ese jugador.</div>`;
  const s = d.stats[c] || { pj: 0, tit: 0, min: 0, gol: 0, rojas: 0 };
  // Partidos de los equipos en los que jugó (si cambió de club, muestra ambos).
  const equipos = new Set();
  for (const p of d.partidos) if (p.planilla) for (const lado of ['L', 'V']) if (p[lado].some(j => j.c === c)) equipos.add(lado === 'L' ? p.local : p.visitante);
  const filas = [];
  for (const eq of equipos) for (const x of d.porEquipo[eq] || []) {
    const j = x.p.planilla ? x.p[x.lado].find(j => j.c === c) : null;
    filas.push({ x, j, eq });
  }
  filas.sort((a, b) => (b.x.p.dia + b.x.p.hora).localeCompare(a.x.p.dia + a.x.p.hora));
  const al = d.bajas[info.equipo]?.alertas.find(a => a.carne === c);
  return `<a class="back" href="${link(cat, 'equipo', info.equipo)}">← ${esc(info.equipo)}</a>
  <div class="row">${crest(info.equipo, true)}<div><h2>${esc(info.nombre)}</h2><div class="small muted">${esc(info.equipo)}${info.camiseta ? ' · camiseta ' + esc(info.camiseta) : ''} · carné ${esc(c)}</div></div></div>
  ${al ? `<div class="card"><div class="alert"><b class="lvl ${al.nivel}">${al.nivel}</b><b>Posible baja</b><span>${esc(al.texto)}</span></div></div>` : ''}
  <div class="tiles">
    <div class="tile"><b>${s.pj}</b><small>Partidos</small></div>
    <div class="tile"><b>${s.tit}</b><small>Titular</small></div>
    <div class="tile"><b>${s.min}</b><small>Minutos</small></div>
    <div class="tile"><b>${s.pj ? Math.round(s.min / s.pj) : 0}</b><small>Min por partido</small></div>

    return otras.length ? `<div class="stack"><h3>También jugó en</h3><div class="card" style="padding:0">${otras.map(o => `<div class="xrow"><span class="otra"><a href="${link(o.div, 'jugador', c)}">${esc(DIVS[o.div]?.nombre || o.div)}</a>${o.equipo !== info.equipo ? `<span>(${esc(o.equipo)})</span>` : ''}<span>${o.pj} PJ · ${o.tit} tit. · ${o.min}' · último ${fDia(o.ultimo)}</span></span></div>`).join('')}</div></div>` : '';
  })()}
  ${(() => {
    const ss = (d.sanciones || []).filter(x => x.c === c);
    return ss.length ? `<div class="stack"><h3>Sanciones</h3><div class="card" style="padding:0">${ss.map(x => filaSancion(cat, d, x)).join('')}</div></div>` : '';
  })()}
  <div class="stack"><h3>Partido a partido</h3><div class="card log" style="padding:0">
  ${filas.map(({ x, j, eq }) => {
    const p = x.p, res = `${x.gf}-${x.gc}`, r = x.gf > x.gc ? 'G' : x.gf < x.gc ? 'P' : 'E';
    const cab = `<span class="f">F${p.fecha}</span><span class="r">${x.lado === 'L' ? 'vs' : 'en'} ${esc(x.rival)} <span class="muted small">${res} ${r}</span>${equipos.size > 1 ? ` <span class="tag">${esc(eq)}</span>` : ''}</span>`;
    if (!p.planilla) return `<div class="nope">${cab}<span class="min muted">–</span><span class="d">${fDia(p.dia)} · ${esc(p.etapa)} · sin planilla</span></div>`;
    if (!j) return `<a class="nope" href="${link(cat, 'partido', p.id)}">${cab}<span class="min muted">0</span><span class="d">${fDia(p.dia)} · ${esc(p.etapa)} · no jugó</span></a>`;
    return `<a href="${link(cat, 'partido', p.id)}">${cab}<span class="min">${j.min}'</span><span class="d">${fDia(p.dia)} · ${esc(p.etapa)} · ${rol(j)}${j.g.length ? ` <span class="tag gol">${j.g.length} gol${j.g.length > 1 ? 'es' : ''}</span>` : ''}${j.x ? ' <span class="tag red">expulsado</span>' : ''}</span>${barra(j, p.fin)}</a>`;
  }).join('')}
  </div></div>`;
}

function filaPartidos(cat, ps) {
  return ps.map(p => `<a class="match" href="${link(cat, 'partido', p.id)}">
    <span class="t">${crest(p.local)}<span>${esc(p.local)}</span></span>
    <span class="score">${p.gl}-${p.gv}</span>
    <span class="t v"><span>${esc(p.visitante)}</span>${crest(p.visitante)}</span>
    ${!p.planilla ? `<span class="warn">${p.wo ? 'Walkover' : 'Sin planilla'}</span>` : p.problemas ? `<span class="warn">${p.problemas} observación${p.problemas > 1 ? 'es' : ''} en la planilla</span>` : ''}</a>`).join('');
}

function vPartidos(d, cat) {
  const grupos = new Map();
  for (const p of [...d.partidos].reverse()) {
    const k = `${p.etapa} · Fecha ${p.fecha}`;
    if (!grupos.has(k)) grupos.set(k, []);
    grupos.get(k).push(p);
  }
  return `<h2>Partidos</h2>` + [...grupos].map(([k, ps]) => `<div class="stack"><h3>${esc(k)} <span class="small muted" style="font-family:var(--body);font-weight:500">${fDia(ps[ps.length - 1].dia)}</span></h3><div class="card" style="padding:0">${filaPartidos(cat, ps)}</div></div>`).join('');
}

function vPartido(d, cat, id) {
  const p = d.porId[id];
  if (!p) return `<div class="empty">No encontré ese partido.</div>`;
  const head = `<a class="back" href="${link(cat, 'partidos')}">← Partidos</a>
  <div class="card stack"><div class="small muted" style="text-align:center">${esc(p.etapa)} · Fecha ${p.fecha} · ${fDia(p.dia)}${p.hora !== '00:00' ? ' ' + p.hora : ''}${p.cancha ? ' · ' + esc(p.cancha) : ''}</div>
  <div class="bigscore"><a href="${link(cat, 'equipo', p.local)}">${crest(p.local, true)}${esc(p.local)}</a><span class="score">${p.gl}-${p.gv}</span><a href="${link(cat, 'equipo', p.visitante)}">${crest(p.visitante, true)}${esc(p.visitante)}</a></div>
  <div class="small muted" style="text-align:center"><a href="https://ligauniversitaria.org.uy/resultados/detallePartido.html?id=${esc(p.id)}" target="_blank" rel="noopener">Ver planilla en la LUD</a></div></div>`;
  if (!p.planilla) return head + `<div class="empty">${p.wo ? 'Partido ganado por walkover: no hay planilla.' : 'La Liga todavía no cargó la planilla de este partido.'}</div>`;
  const nom = c => d.jugadores[c]?.nombre || c;
  const ev = p.eventos.map(e => {
    let txt;
    if (e.tipo === 'cambio') txt = `${e.entra ? `<a class="in" href="${link(cat, 'jugador', e.entra)}">▲ ${esc(e.entraN)}</a>` : `<span class="in">▲ ${esc(e.entraN)}</span>`}<br>${e.sale ? `<a class="out" href="${link(cat, 'jugador', e.sale)}">▼ ${esc(e.saleN)}</a>` : `<span class="out">▼ ${esc(e.saleN)}</span>`}`;
    else txt = `<b>⚽ ${esc(e.nombre)}</b>${e.tipo === 'gol-contra' ? ' <span class="tag red">en contra</span>' : ''}`;
    return `<div class="ev"><div class="l">${e.lado === 'L' ? txt : ''}</div><div class="m">${e.m ?? '?'}'</div><div>${e.lado === 'V' ? txt : ''}</div></div>`;
  }).join('');
  const lineup = (lado, eq) => {
    const js = p[lado];
    const pl = j => `<div class="pl"><span class="n">${esc(j.cam)}</span><a href="${link(cat, 'jugador', j.c)}">${esc(nom(j.c))}${j.cap ? ' <span class="tag">C</span>' : ''}${j.x ? ' <span class="tag red">roja</span>' : ''}</a><span class="mm">${j.min}'</span>${barra(j, p.fin)}</div>`;
    return `<div class="card lineup"><h3>${esc(eq)}</h3><div class="sep">Titulares</div>${js.filter(j => j.t).map(pl).join('')}${js.some(j => !j.t) ? '<div class="sep">Entraron</div>' + js.filter(j => !j.t).map(pl).join('') : ''}</div>`;
  };
  const obs = d.calidad.find(c => c.id === p.id);
  return head + `
  ${ev ? `<div class="card"><h3 style="margin-bottom:6px">Minuto a minuto</h3><div class="timeline">${ev}</div></div>` : ''}
  <div class="lineups">${lineup('L', p.local)}${lineup('V', p.visitante)}</div>
  ${obs ? `<div class="card"><h3 style="margin-bottom:6px">Observaciones de la planilla</h3><ul class="issues">${obs.problemas.map(t => `<li>${esc(t)}</li>`).join('')}</ul></div>` : ''}`;
}

function vPlanillas(d, cat) {
  const r = d.resumen;
  return `<h2>Revisión de planillas</h2>
  <p class="lede">Cada partido se revisa solo: que haya 11 titulares, que los cambios tengan sentido (nadie sale si no estaba en cancha), que los goles cierren con el resultado y que los goleadores estuvieran jugando. Lo que no cierra se descarta del cálculo y queda anotado acá.</p>
  <div class="tiles"><div class="tile"><b>${r.partidos}</b><small>Partidos jugados</small></div><div class="tile"><b>${r.conPlanilla}</b><small>Con planilla</small></div><div class="tile"><b>${r.conProblemas}</b><small>Con observaciones</small></div></div>
  ${d.calidad.length ? d.calidad.slice().reverse().map(c => `<div class="card stack"><a href="${link(cat, 'partido', c.id)}" style="font-weight:700;color:var(--fg)">${esc(c.etapa)} F${c.fecha}: ${esc(c.partido)}</a><ul class="issues">${c.problemas.map(t => `<li>${esc(t)}</li>`).join('')}</ul></div>`).join('') : '<div class="empty">Todas las planillas cierran.</div>'}`;
}


// ---------- compartir bajas ----------
let COMPARTIR = null;
const ICONO_COMPARTIR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"/><path d="M16 6l-4-4-4 4"/><path d="M12 2v13"/></svg>';
function textoBajas(d, cat, f, nivel) {
  const linea = eq => {
    const b = d.bajas[eq];
    const al = (b?.alertas || []).filter(a => (nivel === 'todas' ? a.nivel !== 'baja' : a.nivel === 'alta'));
    if (!al.length) return `*${eq}:* sin bajas detectadas`;
    return `*${eq}:*\n` + al.map(a => `• ${a.nombre}: ${a.texto}`).join('\n');
  };
  return `⚽ ${DIVS[cat].nombre} · ${f.l} vs ${f.v} (${fDia(f.dia)}${f.hora !== '00:00' ? ' ' + f.hora : ''})\n${linea(f.l)}\n${linea(f.v)}`;
}
async function compartir(i) {
  const { cat, nivel, lista } = COMPARTIR; const d = cache[cat];
  const partes = (i == null ? lista : [lista[i]]).map(f => textoBajas(d, cat, f, nivel));
  const url = `${location.origin}${location.pathname}#/${cat}/bajas`;
  const texto = `${i == null ? `Posibles bajas · ${DIVS[cat].nombre}\n\n` : ''}${partes.join('\n\n')}\n\n${url}`;
  if (navigator.share) { try { await navigator.share({ text: texto }); return; } catch (e) { if (e.name === 'AbortError') return; } }
  try { await navigator.clipboard.writeText(texto); } catch {}
  window.open('https://wa.me/?text=' + encodeURIComponent(texto), '_blank', 'noopener');
  aviso('Texto copiado. Se abre WhatsApp para mandarlo.');
}
function aviso(t) { const e = document.createElement('div'); e.className = 'toast'; e.textContent = t; document.body.append(e); setTimeout(() => e.remove(), 3200); }

// ---------- rankings ----------
function vRankings(d, cat) {
  const P = {}; const usados = {}; const titDistintos = {};
  const minEquipo = {};
  for (const p of d.partidos) if (p.planilla) for (const [lado, eq] of [['L', p.local], ['V', p.visitante]]) {
    minEquipo[eq] = (minEquipo[eq] || 0) + p.fin;
    for (const j of p[lado]) {
      const x = (P[j.c] ??= { c: j.c, eq, min: 0, pj: 0, tit: 0, gol: 0, golBanco: 0, ingresos: 0, rojas: 0 });
      x.eq = eq; x.min += j.min; x.pj++; x.tit += j.t; x.gol += j.g.length; x.rojas += j.x;
      if (!j.t) { x.ingresos++; x.golBanco += j.g.length; }
      (usados[eq] ??= new Set()).add(j.c); if (j.t) (titDistintos[eq] ??= new Set()).add(j.c);
    }
  }
  const L = Object.values(P);
  const nom = c => d.jugadores[c]?.nombre || c;
  const fila = (i, x, v, u) => `<li><span class="p">${i + 1}</span>${crest(x.eq)}<span style="min-width:0"><a href="${link(cat, 'jugador', x.c)}">${esc(nom(x.c))}</a><span class="eq">${esc(x.eq)}</span></span><span class="v">${v}${u ? `<small>${u}</small>` : ''}</span></li>`;
  const top = (arr, k, n = 10) => arr.filter(k).slice(0, n);
  const card = (t, sub, filas) => `<section class="card"><h3>${t}</h3>${sub ? `<div class="sub">${sub}</div>` : ''}<ol>${filas || '<li><span></span><span></span><span class="muted">Nadie todavía.</span><span></span></li>'}</ol></section>`;
  const porMin = [...L].sort((a, b) => b.min - a.min);
  const goleadores = [...L].sort((a, b) => b.gol - a.gol || a.min - b.min);
  const cada90 = L.filter(x => x.min >= 450 && x.gol >= 2).map(x => ({ ...x, r: x.min / x.gol })).sort((a, b) => a.r - b.r);
  const banco = [...L].sort((a, b) => b.ingresos - a.ingresos || b.golBanco - a.golBanco);
  const pct = L.map(x => ({ ...x, pct: x.min / (minEquipo[x.eq] || 1) })).sort((a, b) => b.pct - a.pct);
  const rojas = [...L].sort((a, b) => b.rojas - a.rojas);
  const equipos = d.equipos.map(eq => ({ eq, u: usados[eq]?.size || 0, t: titDistintos[eq]?.size || 0 })).sort((a, b) => b.u - a.u);
  return `<div class="stack"><h2>Rankings</h2><p class="lede">Con los minutos de las planillas de toda la temporada en ${esc(DIVS[cat].nombre)}.</p></div>
  <div class="rk">
    ${card('Más minutos', 'Minutos jugados en la temporada.', top(porMin, x => x.min).map((x, i) => fila(i, x, x.min, 'min')).join(''))}
    ${card('Goleadores', 'Goles según las planillas (sin goles en contra).', top(goleadores, x => x.gol).map((x, i) => fila(i, x, x.gol, x.pj + ' PJ')).join(''))}
    ${card('Gol cada pocos minutos', 'Minutos por gol. Mínimo 450 minutos y 2 goles.', top(cada90, x => 1).map((x, i) => fila(i, x, Math.round(x.r), "' por gol")).join(''))}
    ${card('Siempre en cancha', 'Porcentaje de los minutos de su equipo que jugó.', top(pct, x => x.min).map((x, i) => fila(i, x, Math.round(x.pct * 100), '%')).join(''))}
    ${card('Los que más entran', 'Veces que entró desde el banco (y goles saliendo del banco).', top(banco, x => x.ingresos).map((x, i) => fila(i, x, x.ingresos, x.golBanco ? `${x.golBanco} gol${x.golBanco > 1 ? 'es' : ''}` : 'veces')).join(''))}
    ${card('Más expulsiones', 'Rojas según las planillas.', top(rojas, x => x.rojas).map((x, i) => fila(i, x, x.rojas, x.rojas > 1 ? 'rojas' : 'roja')).join(''))}
    ${card('Equipos que más rotan', 'Jugadores distintos que usó cada equipo (y cuántos fueron titulares).', equipos.map((x, i) => `<li><span class="p">${i + 1}</span>${crest(x.eq)}<span style="min-width:0"><a href="${link(cat, 'equipo', x.eq)}">${esc(x.eq)}</a></span><span class="v">${x.u}<small>${x.t} tit.</small></span></li>`).join(''))}
  </div>`;
}

// ---------- entre categorías ----------
function vCruces(d, cat, filtro) {
  const soloFinde = filtro === 'finde';
  const nom = c => d.jugadores[c]?.nombre || c;
  const grupos = Object.entries(d.cruces || {}).sort((a, b) => a[0].localeCompare(b[0]));
  const total = grupos.reduce((n, [, l]) => n + l.length, 0);
  const finde = grupos.reduce((n, [, l]) => n + l.filter(x => x.finde).length, 0);
  const bloques = grupos.map(([eq, l]) => {
    const filas = l.filter(x => !soloFinde || x.finde);
    if (!filas.length) return '';
    return `<section class="card" style="padding:0"><div class="fixture-h"><span class="row">${crest(eq)}<a href="${link(cat, 'equipo', eq)}" style="font-family:var(--display);font-weight:800;font-size:1.15rem;color:var(--fg);text-decoration:none">${esc(eq)}</a></span><span>${filas.length} jugador${filas.length > 1 ? 'es' : ''}</span></div>
      ${filas.map(x => `<div class="xrow"><a href="${link(cat, 'jugador', x.c)}">${esc(nom(x.c))}${x.finde ? ' <span class="tag amber">este finde en otra</span>' : ''}</a>
        <span class="aqui">Acá: ${x.aqui.pj} PJ · ${x.aqui.tit} tit. · ${x.aqui.min}' · último ${fDia(x.aqui.ultimo)}</span>
        ${x.otras.map(o => `<span class="otra"><a href="${link(o.div, 'jugador', x.c)}">${esc(DIVS[o.div]?.nombre || o.div)}</a>${o.equipo !== eq ? `<span>(${esc(o.equipo)})</span>` : ''}<span>${o.pj} PJ · ${o.tit} tit. · ${o.min}' · último ${fDia(o.ultimo)} (${o.ultMin}')</span></span>`).join('')}
      </div>`).join('')}</section>`;
  }).join('');
  return `<div class="stack"><h2>Entre categorías</h2>
  <p class="lede">Jugadores de ${esc(DIVS[cat].nombre)} que también jugaron en otra divisional (mismo carné). Sirve para ver quién sube del Sub 20, quién baja a Reserva y quién jugó el mismo fin de semana en dos categorías.</p></div>
  <div class="chips" role="group" aria-label="Filtro">
    <button class="chip" aria-pressed="${!soloFinde}" onclick="location.hash='${link(cat, 'cruces')}'">Todos (${total})</button>
    <button class="chip" aria-pressed="${soloFinde}" onclick="location.hash='${link(cat, 'cruces', 'finde')}'">Jugaron en otra el último finde (${finde})</button>
  </div>
  ${bloques || '<div class="empty">Nadie de esta divisional jugó en otra.</div>'}`;
}

// ---------- sanciones ----------
const ESTADO = { vigente: ['Vigente', 'red'], 'a-confirmar': ['A confirmar', 'amber'], pendiente: ['Esperando fallo', 'amber'], cumplida: ['Cumplida', ''], 'sin-suspension': ['Sin suspensión', ''] };
function filaSancion(cat, d, s) {
  const [et, cl] = ESTADO[s.estado];
  const nom = d.jugadores[s.c]?.nombre || s.c;
  const ver = s.partido && s.partido.div === cat ? ` · <a href="${link(cat, 'partido', s.partido.id)}">ver partido</a>` : '';
  return `<div class="sx">${crest(s.equipo)}<span><a class="n" href="${link(cat, 'jugador', s.c)}">${esc(nom)}</a> <span class="tag ${cl}">${et}</span>${s.restan ? ` <span class="tag red">le ${s.restan === 1 ? 'queda 1 fecha' : `quedan ${s.restan}`}</span>` : ''}</span>
    <span class="t">${esc(s.equipo)} · ${esc(s.resumen)}${ver}</span></div>`;
}
function vSanciones(d, cat) {
  const S = d.sanciones || [];
  const vig = S.filter(s => s.estado === 'vigente' || s.estado === 'a-confirmar');
  const pen = S.filter(s => s.estado === 'pendiente');
  const hist = S.filter(s => s.estado === 'cumplida' || s.estado === 'sin-suspension').sort((a, b) => b.fecha.localeCompare(a.fecha));
  return `<div class="stack"><h2>Sanciones</h2>
  <p class="lede">De Fallos y Penas de la Liga: suspensiones automáticas por expulsión y fallos del Tribunal, de jugadores que jugaron en ${esc(DIVS[cat].nombre)}. Incluye sanciones de otras categorías, porque la mayoría se cumplen en todas.</p></div>
  <details class="help"><summary>¿Cómo se cuentan las fechas?</summary><ul>
    <li>La Liga dice cuántas fechas de suspensión le dieron. Las cumplidas se cuentan con los partidos que jugó su equipo, en la divisional donde lo expulsaron, después de ese partido.</li>
    <li>Es una cuenta aproximada: si la Liga cuenta distinto (por ejemplo, partidos de otra categoría), puede variar.</li>
    <li><b>Esperando fallo:</b> lo expulsaron, la sanción automática no lo suspendió y el Tribunal todavía no resolvió.</li>
    <li>La Liga publica los fallos los jueves; el robot los baja el jueves de noche.</li>
  </ul></details>
  <section class="card" style="padding:0"><div class="fixture-h"><b>Vigentes</b><span>${vig.length}</span></div>${vig.map(s => filaSancion(cat, d, s)).join('') || '<div class="ok" style="padding:12px 14px">Nadie suspendido ahora.</div>'}</section>
  ${pen.length ? `<section class="card" style="padding:0"><div class="fixture-h"><b>Esperando fallo</b><span>${pen.length}</span></div>${pen.map(s => filaSancion(cat, d, s)).join('')}</section>` : ''}
  <section class="card" style="padding:0"><details class="more"><summary>Historial de la temporada (${hist.length})</summary>${hist.map(s => filaSancion(cat, d, s)).join('')}</details></section>`;
}

// ---------- previas ----------
function racha(d, eq, n = 5) {
  return (d.porEquipo[eq] || []).slice().sort((a, b) => (a.p.dia + a.p.hora).localeCompare(b.p.dia + b.p.hora)).slice(-n)
    .map(x => ({ r: x.gf > x.gc ? 'G' : x.gf < x.gc ? 'P' : 'E', x }));
}
const formaHtml = (d, eq) => `<span class="forma" aria-label="Últimos 5">${racha(d, eq).map(({ r, x }) => `<b class="${r}" title="${x.gf}-${x.gc} vs ${esc(x.rival)} (${fDia(x.p.dia)})">${r}</b>`).join('')}</span>`;
const previasOrden = d => Object.entries(d.previas || {}).sort((a, b) => (a[1].dia + a[1].hora).localeCompare(b[1].dia + b[1].hora));
function vPrevias(d, cat) {
  const L = previasOrden(d);
  return `<div class="stack"><h2>Previas</h2><p class="lede">Los partidos de la próxima fecha de ${esc(DIVS[cat].nombre)}. Entrá a cada uno para ver el once probable, las bajas, cómo vienen y el cara a cara.</p></div>
  ${L.length ? `<div class="card" style="padding:0">${L.map(([k, f]) => `<a class="pv-card" href="${link(cat, 'previa', k)}">
    <span class="t">${crest(f.l)}<span>${esc(f.l)}</span>${formaHtml(d, f.l)}</span>
    <span class="mid"><b>${fDia(f.dia)}</b>${f.hora !== '00:00' ? f.hora : 'hora a confirmar'}${f.etapa ? '<br>' + esc(f.etapa) : ''}</span>
    <span class="t">${crest(f.v)}<span>${esc(f.v)}</span>${formaHtml(d, f.v)}</span></a>`).join('')}</div>` : '<div class="empty">No hay partidos programados todavía.</div>'}`;
}
// Goles a favor y en contra por tramo de 15 minutos, en la divisional.
function tramosGoles(d, eq) {
  const T = [[0, 15], [16, 30], [31, 45], [46, 60], [61, 75], [76, 200]];
  const f = T.map(() => 0), c = T.map(() => 0);
  for (const p of d.partidos) {
    if (!p.planilla || (p.local !== eq && p.visitante !== eq)) continue;
    const yo = p.local === eq ? 'L' : 'V';
    for (const e of p.eventos) if (e.tipo !== 'cambio' && e.m != null) {
      const i = T.findIndex(([a, b]) => e.m >= a && e.m <= b);
      if (i < 0) continue;
      if (e.lado === yo) f[i]++; else c[i]++;
    }
  }
  return { T, f, c };
}
function vTramos(d, eq) {
  const { T, f, c } = tramosGoles(d, eq);
  const mx = Math.max(1, ...f, ...c), tf = f.reduce((a, b) => a + b, 0), tc = c.reduce((a, b) => a + b, 0);
  const et = ([a, b]) => b > 90 ? `76-90+` : `${a}-${b}`;
  const filas = T.map((t, i) => `<span class="r">${et(t)}'</span>
    ${f[i] ? `<span class="bf" style="width:${Math.max(18, f[i] / mx * 100)}%">${f[i]}</span>` : '<span class="z">–</span>'}
    ${c[i] ? `<span class="bc" style="width:${Math.max(18, c[i] / mx * 100)}%">${c[i]}</span>` : '<span class="z">–</span>'}`).join('');
  const fin = tf ? Math.round(f[5] / tf * 100) : 0, finC = tc ? Math.round(c[5] / tc * 100) : 0;
  const primer = tf ? Math.round((f[0] + f[1] + f[2]) / tf * 100) : 0;
  const datos = [];
  if (tf >= 5 && fin >= 30) datos.push(`Hace el ${fin}% de sus goles del 76' en adelante.`);
  if (tc >= 5 && finC >= 30) datos.push(`Le hacen el ${finC}% de los goles del 76' en adelante.`);
  if (tf >= 5 && primer >= 60) datos.push(`Hace el ${primer}% de sus goles en el primer tiempo.`);
  return `<div class="tramos"><span class="h">Min.</span><span class="h">A favor (${tf})</span><span class="h">En contra (${tc})</span>${filas}</div>${datos.map(t => `<p class="dato">${esc(t)}</p>`).join('')}`;
}
function goleadoresForma(d, eq) {
  const g = {};
  for (const { x } of racha(d, eq)) if (x.p.planilla) for (const j of x.p[x.lado]) if (j.g.length) g[j.c] = (g[j.c] || 0) + j.g.length;
  return Object.entries(g).sort((a, b) => b[1] - a[1]).slice(0, 4);
}
function vOnce(d, cat, eq) {
  const pr = d.bajas[eq]?.probable;
  if (!pr || !pr.once.length) return `<div class="card lineup"><h3>${esc(eq)}</h3><div class="ok">Sin planillas suficientes.</div></div>`;
  const nom = c => d.jugadores[c]?.nombre || c;
  const pl = x => `<div class="pl"><span class="n">${esc(x.cam)}</span><a href="${link(cat, 'jugador', x.c)}">${esc(nom(x.c))}</a><span class="pc">${x.pct}%</span>
    <div class="bar"><span style="left:0;width:${x.pct}%"></span></div>${x.duda ? `<span></span><span class="small" style="grid-column:2/4;color:var(--amber)">Duda: ${esc(x.duda)}</span>` : ''}</div>`;
  return `<div class="card xi"><h3>${esc(eq)}</h3>
    ${pr.once.map(pl).join('')}
    ${pr.afuera.length ? `<div class="sep">Afuera</div>${pr.afuera.map(x => `<div class="pl"><span class="n"></span><a href="${link(cat, 'jugador', x.c)}">${esc(nom(x.c))}</a><span class="pc" style="color:var(--red)">${esc(x.motivo)}</span></div>`).join('')}` : ''}
    ${pr.alternativas.length ? `<div class="sep">Los que pelean el lugar</div>${pr.alternativas.map(pl).join('')}` : ''}</div>`;
}
function vPrevia(d, cat, k) {
  const f = d.previas?.[k];
  if (!f) return `<a class="back" href="${link(cat, 'previas')}">← Previas</a><div class="empty">Ese partido ya no está en la próxima fecha.</div>`;
  const bajasDe = eq => {
    const b = d.bajas[eq]; const al = (b?.alertas || []).filter(a => a.nivel !== 'baja');
    return `<div class="side"><div class="side-h">${crest(eq)}<a href="${link(cat, 'equipo', eq)}">${esc(eq)}</a></div>${pend(b)}${al.length ? al.map(a => `<div class="alert"><b class="lvl ${a.nivel}">${a.nivel}</b>${a.carne ? `<a href="${link(cat, 'jugador', a.carne)}">${esc(a.nombre)}</a>` : `<b>${esc(a.nombre)}</b>`}<span>${esc(a.texto)}</span></div>`).join('') : '<div class="ok">Sin bajas detectadas.</div>'}</div>`;
  };
  const resumen = eq => {
    const ps = d.porEquipo[eq] || []; const g = ps.filter(x => x.gf > x.gc).length, e = ps.filter(x => x.gf === x.gc).length;
    return `${ps.length} PJ · ${g}G ${e}E ${ps.length - g - e}P · ${ps.reduce((s, x) => s + x.gf, 0)}-${ps.reduce((s, x) => s + x.gc, 0)}`;
  };
  const gf = eq => { const l = goleadoresForma(d, eq); return l.length ? l.map(([c, n]) => `<a href="${link(cat, 'jugador', c)}">${esc(d.jugadores[c]?.nombre || c)}</a> (${n})`).join(', ') : 'nadie hizo goles'; };
  const h2h = f.caraACara || [];
  const lineaH = x => `<a class="h2h" href="${link(x.div, 'partido', x.id)}"><span class="dv">${esc(DIVS[x.div]?.nombre || x.div)}<br>${fDia(x.dia)}</span><span class="r">${esc(x.local)}</span><span class="sc">${x.gl}-${x.gv}</span><span>${esc(x.visitante)}</span></a>`;
  PREVIA = { cat, k };
  return `<a class="back" href="${link(cat, 'previas')}">← Previas</a>
  <div class="card stack"><div class="small muted" style="text-align:center">${esc(f.etapa || '')} · ${fDia(f.dia)}${f.hora !== '00:00' ? ' ' + f.hora : ''}${f.cancha && f.cancha !== 'Cancha A Fijar' ? ' · ' + esc(f.cancha) : ''}</div>
    <div class="bigscore"><a href="${link(cat, 'equipo', f.l)}">${crest(f.l, true)}${esc(f.l)}</a><span class="score" style="background:var(--surface-2);color:var(--muted);font-size:1.4rem">vs</span><a href="${link(cat, 'equipo', f.v)}">${crest(f.v, true)}${esc(f.v)}</a></div>
    <div class="bigscore" style="font-size:.78rem;color:var(--muted)"><span>${formaHtml(d, f.l)}<br>${resumen(f.l)}</span><span></span><span>${formaHtml(d, f.v)}<br>${resumen(f.v)}</span></div>
    <div class="row" style="justify-content:center"><button class="share" onclick="compartirPrevia()">${ICONO_COMPARTIR}<span>Compartir la previa</span></button></div></div>
  <section class="fixture"><div class="fixture-h"><b>Bajas</b><a href="${link(cat, 'bajas')}">todas las de la fecha</a></div>${bajasDe(f.l)}${bajasDe(f.v)}</section>
  <div class="stack"><h3>Once probable</h3><p class="lede small">Armado con los titulares de los últimos 5 partidos (pesan más los recientes). El % es cuántas veces fue titular en ese tramo; los suspendidos quedan afuera y las dudas aparecen marcadas.</p></div>
  <div class="two">${vOnce(d, cat, f.l)}${vOnce(d, cat, f.v)}</div>
  <div class="stack"><h3>Cara a cara en la temporada</h3><p class="lede small">Todos los partidos entre estos clubes, en Mayores, Sub 20 y Reserva.</p></div>
  ${h2h.length ? `<div class="card" style="padding:0">${h2h.map(lineaH).join('')}</div>` : '<div class="empty">No se cruzaron esta temporada.</div>'}
  <div class="stack"><h3>Cuándo hacen y reciben goles</h3><p class="lede small">Goles en ${esc(DIVS[cat].nombre)} esta temporada, por tramo de 15 minutos.</p></div>
  <div class="two"><div class="card"><h3 style="margin-bottom:8px">${esc(f.l)}</h3>${vTramos(d, f.l)}</div><div class="card"><h3 style="margin-bottom:8px">${esc(f.v)}</h3>${vTramos(d, f.v)}</div></div>
  <div class="card stack"><h3>Goleadores en racha</h3><p class="small" style="margin:0"><b>${esc(f.l)}:</b> ${gf(f.l)}</p><p class="small" style="margin:0"><b>${esc(f.v)}:</b> ${gf(f.v)}</p><p class="small muted" style="margin:0">Goles en los últimos 5 partidos.</p></div>`;
}
let PREVIA = null;
async function compartirPrevia() {
  const { cat, k } = PREVIA; const d = cache[cat]; const f = d.previas[k];
  const nom = c => d.jugadores[c]?.nombre || c;
  const forma = eq => racha(d, eq).map(x => x.r).join('');
  const once = eq => (d.bajas[eq]?.probable?.once || []).map(x => nom(x.c).split(' ').slice(-1)[0] + (x.duda ? ' (duda)' : '')).join(', ');
  const bajas = eq => { const al = (d.bajas[eq]?.alertas || []).filter(a => a.nivel === 'alta'); return al.length ? al.map(a => `• ${a.nombre}: ${a.texto}`).join('\n') : 'sin bajas importantes'; };
  const texto = `⚽ Previa ${DIVS[cat].nombre}: ${f.l} vs ${f.v} (${fDia(f.dia)}${f.hora !== '00:00' ? ' ' + f.hora : ''})

*${f.l}* (${forma(f.l)})
Once probable: ${once(f.l)}
${bajas(f.l)}

*${f.v}* (${forma(f.v)})
Once probable: ${once(f.v)}
${bajas(f.v)}

${location.origin}${location.pathname}${link(cat, 'previa', k)}`;
  if (navigator.share) { try { await navigator.share({ text: texto }); return; } catch (e) { if (e.name === 'AbortError') return; } }
  try { await navigator.clipboard.writeText(texto); } catch {}
  window.open('https://wa.me/?text=' + encodeURIComponent(texto), '_blank', 'noopener');
  aviso('Texto copiado. Se abre WhatsApp para mandarlo.');
}

// ---------- mi equipo ----------
let CLUBES = null;
async function clubes() {
  if (!CLUBES) { const r = await fetch(`data/clubes.json?v=${Math.floor(Date.now() / 6e5)}`); CLUBES = (await r.json()).clubes; }
  return CLUBES;
}
async function seguir(div, eq) {
  const C = await clubes();
  const k = Object.keys(C).find(k => C[k].equipos.some(e => e.div === div && e.equipo === eq));
  if (!k) return;
  guardar('club', k); location.hash = '#/mi-equipo';
}
function elegirClub(k) { guardar('club', k); if (location.hash === '#/mi-equipo') render(); else location.hash = '#/mi-equipo'; }
async function renderMiEquipo(sub) {
  const main = $('#main');
  let C; try { C = await clubes(); } catch { main.innerHTML = '<div class="empty">No se pudieron cargar los clubes.</div>'; return; }
  const k = leer('club');
  $('#foot').innerHTML = 'Tu equipo queda guardado en este navegador.';
  if (!k || !C[k] || sub === 'elegir') {
    const lista = Object.entries(C);
    main.innerHTML = `<div class="stack"><h2>Elegí tu equipo</h2><p class="lede">Al abrir la web vas a ver directo lo de tu club: próximos partidos, bajas y suspendidos en todas las categorías.</p></div>
      <input class="search" id="qc" type="search" placeholder="Buscar club" autocomplete="off">
      <div class="card" style="padding:0" id="lc">${lista.map(([ck, c]) => `<button class="club-pick" data-n="${esc(slug(c.nombre))}" onclick="elegirClub('${ck}')">${crest(c.equipos[0].equipo)}<span class="n">${esc(c.nombre)}</span><small>${[...new Set(c.equipos.map(e => DIVS[e.div]?.nombre))].join(' · ')}</small></button>`).join('')}</div>`;
    const q = $('#qc'); q.focus();
    q.addEventListener('input', () => { const v = slug(q.value); document.querySelectorAll('#lc .club-pick').forEach(b => b.hidden = !!v && !b.dataset.n.includes(v)); });
    return;
  }
  const c = C[k];
  const card = e => {
    const n = e.proximo, u = e.ultimo;
    const prev = n ? link(e.div, 'previa', n.local ? `${e.equipo}~${n.rival}` : `${n.rival}~${e.equipo}`) : null;
    return `<section class="fixture team-card"><div class="fixture-h"><span><b>${esc(DIVS[e.div]?.nombre || e.div)}</b>${e.equipo !== c.nombre ? ` · ${esc(e.equipo)}` : ''}</span><a href="${link(e.div, 'equipo', e.equipo)}">plantel</a></div>
      <div class="nx">${n ? `<span>Próximo:</span><b>vs ${esc(n.rival)}</b><span class="muted">${fDia(n.dia)}${n.hora !== '00:00' ? ' ' + n.hora : ''}${n.local ? ' · local' : ''}</span><a class="share" href="${prev}" style="margin-left:auto;text-decoration:none">Previa</a>` : '<span class="muted">Sin partido programado.</span>'}</div>
      <div class="side">${pend(e)}${u ? `<div class="ok">Último con planilla: <a href="${link(e.div, 'partido', u.id)}" style="color:inherit">${u.gf}-${u.gc} vs ${esc(u.rival)} (${fDia(u.dia)})</a></div>` : ''}
      ${e.alertas.length ? e.alertas.map(a => `<div class="alert"><b class="lvl ${a.nivel}">${a.nivel}</b>${a.carne ? `<a href="${link(e.div, 'jugador', a.carne)}">${esc(a.nombre)}</a>` : `<b>${esc(a.nombre)}</b>`}<span>${esc(a.texto)}</span></div>`).join('') : '<div class="ok">Sin bajas detectadas.</div>'}</div></section>`;
  };
  const prox = c.equipos.filter(e => e.proximo).sort((a, b) => (a.proximo.dia + a.proximo.hora).localeCompare(b.proximo.dia + b.proximo.hora));
  const sinProx = c.equipos.filter(e => !e.proximo);
  const susp = c.equipos.flatMap(e => e.alertas.filter(a => a.tipo === 'suspendido').map(a => a.carne)).filter((x, i, l) => l.indexOf(x) === i).length;
  main.innerHTML = `<div class="club-h">${crest(c.equipos[0].equipo, true)}<div style="flex:1;min-width:0"><h2>${esc(c.nombre)}</h2><div class="small muted">${c.equipos.length} equipo${c.equipos.length > 1 ? 's' : ''} · ${susp ? `${susp} suspendido${susp > 1 ? 's' : ''}` : 'sin suspendidos'}</div></div><a class="share" href="#/mi-equipo/elegir" style="text-decoration:none">Cambiar</a></div>
    ${prox.length ? `<h3>Próximos partidos</h3>${prox.map(card).join('')}` : ''}
    ${sinProx.length ? `<h3>Sin partido programado</h3>${sinProx.map(card).join('')}` : ''}`;
}

// ---------- router ----------
async function render() {
  let [cat0, tab0, ...rest] = location.hash.replace(/^#\/?/, '').split('/').map(decodeURIComponent);
  try { await indice(); }
  catch { $('#main').innerHTML = '<div class="empty">No se pudieron cargar los datos. Probá recargar la página.</div>'; return; }
  cat0 = ALIAS[cat0] || cat0;
  // Sin dirección: si tiene equipo elegido, va directo a lo suyo.
  if (!cat0 && leer('club')) { location.replace('#/mi-equipo'); return; }
  if (cat0 === 'mi-equipo') { chrome('mi-equipo'); return renderMiEquipo(tab0); }
  const cat = DIVS[cat0] ? cat0 : (DIVS[leer('div')] ? leer('div') : Object.keys(DIVS)[0]);
  const tab = tab0 || 'bajas';
  guardar('div', cat); guardar('div-' + DIVS[cat].categoria, cat);
  chrome(cat, tab);
  const main = $('#main');
  let d;
  try { d = await datos(cat); }
  catch (e) { main.innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  const arg = rest.join('/');
  const v = { bajas: () => vBajas(d, cat, arg), equipos: () => vEquipos(d, cat), equipo: () => vEquipo(d, cat, arg), jugadores: () => vJugadores(d, cat, arg),
    jugador: () => vJugador(d, cat, arg), partidos: () => vPartidos(d, cat), partido: () => vPartido(d, cat, arg), planillas: () => vPlanillas(d, cat),
    rankings: () => vRankings(d, cat), cruces: () => vCruces(d, cat, arg), sanciones: () => vSanciones(d, cat),
    previas: () => vPrevias(d, cat), previa: () => vPrevia(d, cat, arg) }[tab] || (() => vBajas(d, cat));
  main.innerHTML = v();
  const act = new Date(d.actualizado);
  $('#foot').innerHTML = `Datos de las planillas de la <a href="https://ligauniversitaria.org.uy" target="_blank" rel="noopener">Liga Universitaria</a>, actualizados el ${act.toLocaleDateString('es-UY', { day: 'numeric', month: 'long' })} a las ${act.toLocaleTimeString('es-UY', { hour: '2-digit', minute: '2-digit' })}. Los minutos de los expulsados pueden quedar de más: la Liga no anota el minuto de la expulsión.`;
  const q = $('#q');
  if (q) {
    q.addEventListener('input', () => { history.replaceState(null, '', link(cat, 'jugadores', q.value)); main.innerHTML = vJugadores(d, cat, q.value); bindSearch(cat, d); });
    if (arg) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
  }
  const t = $('#plantel');
  if (t) t.querySelectorAll('th[data-k]').forEach(th => th.addEventListener('click', () => {
    const k = th.dataset.k; orden = { k, dir: orden.k === k ? -orden.dir : (k === 'nombre' ? 1 : -1) }; render();
  }));
  if (!['jugadores'].includes(tab)) window.scrollTo({ top: 0 });
}
function bindSearch(cat, d) {
  const q = $('#q');
  q.focus(); q.setSelectionRange(q.value.length, q.value.length);
  q.addEventListener('input', () => { history.replaceState(null, '', link(cat, 'jugadores', q.value)); $('#main').innerHTML = vJugadores(d, cat, q.value); bindSearch(cat, d); });
}
addEventListener('hashchange', render);
render();
</script>
